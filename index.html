<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clear Mind</title>
<meta name="description" content="A private, offline 30-day journal for calm, clarity and quiet confidence.">
<meta name="theme-color" content="#1E3A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clear Mind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Lora";src:url(fonts/Lora-Variable.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Lora";src:url(fonts/Lora-Italic-Variable.woff2) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --tint:#E2EAE6; --ink:#172726; --muted:#5B6C6A; --line:#D3DCD9;
  --lake:#2A5E62; --lake-ink:#FFFFFF; --dawn:#B7793A; --warn-bg:#F6EBDD;
  --s-calm:#2F6DB5; --s-mood:#C4862B; --s-conf:#9A4F9E;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:8px; --r-md:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1717; --surface:#162121; --tint:#1D2B2B; --ink:#E3ECE9; --muted:#93A5A2; --line:#2A3A3A;
  --lake:#7DBDB8; --lake-ink:#0F1717; --dawn:#E0AD6E; --warn-bg:#2A2419;
  --s-calm:#4A8FD8; --s-mood:#BA7F22; --s-conf:#B070B5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1717; --surface:#162121; --tint:#1D2B2B; --ink:#E3ECE9; --muted:#93A5A2; --line:#2A3A3A;
  --lake:#7DBDB8; --lake-ink:#0F1717; --dawn:#E0AD6E; --warn-bg:#2A2419;
  --s-calm:#4A8FD8; --s-mood:#BA7F22; --s-conf:#B070B5; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--lake)}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:4px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.brand svg{flex:none}
.calm-btn{border:1px solid var(--lake);background:transparent;color:var(--lake);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
main{max-width:660px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:660px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--lake);font-weight:600}
nav.tabs svg{width:22px;height:22px}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0}
h1{font-size:28px}
h2{font-size:21px;margin-bottom:6px}
h3{font-size:17px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.reading p{font-family:var(--serif);font-size:17.5px;line-height:1.68;margin:0 0 14px;max-width:62ch}
.science{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);margin:4px 0 0}
section.block{margin:34px 0 0}
section.block>h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}
hr.soft{border:0;border-top:1px solid var(--line);margin:28px 0}

/* day header */
.dayhead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;margin-top:6px}
.daynum{font-family:var(--serif);font-size:64px;line-height:.85;color:var(--lake);font-weight:500;font-variant-numeric:lining-nums}
.dayhead .meta{font-size:13.5px;color:var(--muted)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px;font-size:14px;color:var(--muted)}
.daynav .arrows{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:disabled{opacity:.35}

/* practice panel */
.practice{background:var(--tint);border-radius:var(--r-md);padding:18px 18px 16px;margin-top:22px}
.practice ol{margin:10px 0 14px;padding-left:22px}
.practice li{margin:0 0 6px;font-size:15.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{white-space:nowrap;border:0;background:var(--lake);color:var(--lake-ink);border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;color:var(--lake);border:1px solid var(--lake)}
.btn.quiet{background:var(--tint);color:var(--ink)}
.btn.danger{background:transparent;color:#B3261E;border:1px solid #B3261E}
.btn.block{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--lake)}

/* forms */
label.f{display:block;font-weight:600;font-size:14.5px;margin:0 0 6px}
.field{margin:0 0 18px}
input[type=text],input[type=number],input[type=time],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font-size:16px;line-height:1.5}
textarea{min-height:92px;resize:vertical;font-family:var(--serif);font-size:16.5px;line-height:1.6}
textarea.free{min-height:220px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--lake);box-shadow:0 0 0 3px color-mix(in srgb,var(--lake) 18%,transparent)}
.prompt{font-family:var(--serif);font-weight:600;font-size:16.5px;margin:0 0 8px;color:var(--ink)}
.prompt .n{color:var(--dawn);margin-right:6px;font-family:var(--sans);font-size:14px}

/* sliders */
.slider{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;margin:0 0 12px}
.slider span.l{font-weight:600;font-size:15px}
.slider output{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;color:var(--lake)}
.slider .ends{grid-column:2;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-8px}
input[type=range]{width:100%;accent-color:var(--lake);height:28px}
input[type=range].unset{opacity:.45}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--lake-ink)}
.lens{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}

/* lists */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list button.item{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 2px;cursor:pointer}
.item .t{font-family:var(--serif);font-weight:600;font-size:16.5px}
.item .s{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seg{display:flex;background:var(--tint);border-radius:999px;padding:3px;margin:0 0 18px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.weekname{font-family:var(--serif);font-size:14px;color:var(--muted);margin:22px 0 6px;font-style:italic}
.done-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lake);margin-right:8px;vertical-align:middle}
.todo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);margin-right:8px;vertical-align:middle}

/* insight */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin:4px 0 8px}
.stats div{background:var(--surface);padding:14px}
.stats b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums}
.stats span{font-size:13px;color:var(--muted)}
.chart{position:relative;margin:10px 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:5}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--muted);font-size:12.5px}
.better{color:#2E7D4F}.worse{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .better{color:#7CCB9A}:root:not([data-theme="light"]) .worse{color:#F2A09A}}
:root[data-theme="dark"] .better{color:#7CCB9A}:root[data-theme="dark"] .worse{color:#F2A09A}
.heat{display:grid;gap:2px;font-size:12.5px}
.heat .c{padding:6px 4px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.heat .h{color:var(--muted);text-align:center;font-size:11.5px}
.heat .n{text-align:left;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{background:var(--warn-bg);border-radius:var(--r-md);padding:14px 16px;font-size:15px;margin:18px 0}
.quote{font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.6;border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:6px 0 14px;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;border-bottom:1px solid var(--line);position:relative;margin-top:14px}
.bars .b{flex:1;max-width:64px;background:var(--lake);border-radius:4px 4px 0 0;position:relative}
.bars .b span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:13px;font-weight:600}
.bars .ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--dawn)}
.bars .ref em{position:absolute;right:0;top:-18px;font-size:11.5px;color:var(--muted);font-style:normal}
.barlabels{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.barlabels span{flex:1;max-width:64px;text-align:center}

/* tools grid */
.tools{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tools li{border-bottom:1px solid var(--line)}
.tools button{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;padding:14px 2px;text-align:left;cursor:pointer}
.tools .t{font-family:var(--serif);font-weight:600;font-size:16.5px}
.tools .s{font-size:14px;color:var(--muted)}
.back{border:0;background:none;color:var(--lake);font-weight:600;padding:0;margin:0 0 14px;cursor:pointer;font-size:15px}
.who{margin:0 0 20px}
.who .q{font-family:var(--serif);font-size:16.5px;margin:0 0 8px}
.who .opts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.who .opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.2;color:var(--muted)}
.who .opts button b{font-size:16px;color:var(--ink)}
.who .opts button[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--lake-ink)}
.who .opts button[aria-pressed="true"] b{color:var(--lake-ink)}
.trap{padding:14px 0;border-bottom:1px solid var(--line)}
.trap h3{font-size:16px}
.trap p{margin:2px 0;font-size:15px}
.trap .q{font-family:var(--serif);font-style:italic;color:var(--lake)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.saved.on{opacity:.9}
.dumb{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.dumb .r{font-size:13.5px}
.dumb .track{position:relative;height:18px;background:var(--tint);border-radius:9px;margin-top:4px}
.dumb .seg2{position:absolute;top:7px;height:4px;background:var(--lake);opacity:.5;border-radius:2px}
.dumb .dot{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;margin-left:-6px;border:2px solid var(--surface)}

/* overlay + pacer — the one bold element */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none}
.overlay.on{display:block}
.overlay .inner{max-width:560px;margin:0 auto}
.overlay .close{float:right}
.pacer{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:18px auto 48px;display:grid;place-items:center}
.pacer .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--lake);opacity:.35}
.pacer .ring:nth-child(2){inset:13%;opacity:.5}
.pacer .ring:nth-child(3){inset:26%;opacity:.7}
.pacer .orb{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--dawn) 55%,var(--surface)),var(--lake));transform:scale(.7);transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.55,1)}
.pacer .word{position:absolute;bottom:-40px;left:0;right:0;text-align:center;font-family:var(--serif);font-size:20px}
.clock{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);margin:18px 0 6px;font-size:15px}
@media (prefers-reduced-motion:reduce){.pacer .orb{transition:none!important;transform:scale(.85)!important}}
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;place-items:center;padding:24px}
.lock.on{display:grid}
.lock .box{width:100%;max-width:320px;text-align:center}
.lock input{text-align:center;font-size:24px;letter-spacing:8px;margin:16px 0}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="none" stroke="currentColor" stroke-opacity=".45"/><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-opacity=".7"/><circle cx="11" cy="11" r="2.4" fill="currentColor"/></svg>Clear Mind</div>
  <button class="calm-btn" id="calmNow" type="button">Calm now</button>
</header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-tab="journal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M5 18a3 3 0 0 1 3-3h11M9 7h6M9 10.5h4"/></svg>Journal</button>
  <button data-tab="insights" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20h18"/><path d="M4 15l5-5 4 3 7-7"/></svg>Insights</button>
  <button data-tab="tools" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tools</button>
</div></nav>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="inner" id="overlayInner"></div></div>
<div class="lock" id="lock"><div class="box">
  <h2>Clear Mind</h2><p class="muted small">Enter your PIN to open your journal.</p>
  <input type="password" id="pinIn" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
  <button class="btn block" id="pinGo" type="button">Open journal</button>
  <p class="small muted" id="pinMsg"></p>
</div></div>
<div class="saved" id="saved" aria-live="polite">Saved</div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
